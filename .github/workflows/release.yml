name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag and the secrets, then open a draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TMDB_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$tag" ]; then
            echo "::error::Tag $tag does not match version $version in package.json. Release with scripts/publish.ps1, it keeps them in step."
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set: the update would be unsigned and installed apps would reject it."
            exit 1
          fi
          if [ -z "$TMDB_KEY" ]; then
            echo "::error::Secret VITE_TMDB_API_KEY is not set: the catalog would be empty in this build."
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          notes_file=$(mktemp)
          git tag -l --format='%(contents)' "$tag" > "$notes_file"
          [ -s "$notes_file" ] || echo "Kinuza $version" > "$notes_file"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$tag\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f name="Kinuza $version" \
              -F body=@"$notes_file" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
          fi
          [ -n "$id" ] || { echo "::error::Could not open the draft release."; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.VITE_OPENSUBTITLES_API_KEY }}
          VITE_REPORT_BOT_TOKEN: ${{ secrets.VITE_REPORT_BOT_TOKEN }}
          VITE_REPORT_CHAT_ID: ${{ secrets.VITE_REPORT_CHAT_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false

  linux:
    needs: draft
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf file xdg-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Run the Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.VITE_OPENSUBTITLES_API_KEY }}
          VITE_REPORT_BOT_TOKEN: ${{ secrets.VITE_REPORT_BOT_TOKEN }}
          VITE_REPORT_CHAT_ID: ${{ secrets.VITE_REPORT_CHAT_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false

  publish:
    needs: [draft, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the update manifest, check the draft and publish it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          folder=$(mktemp -d)
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          export RELEASE_NOTES="$(git tag -l --format='%(contents)' "$tag")"
          gh release download "$tag" --pattern '*.sig' --dir "$folder"
          node scripts/make-update-manifest.cjs "$folder" "$version" "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag" "$folder/latest.json"
          installers=$(node scripts/check-update-manifest.cjs "$folder/latest.json" "$version")
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          while IFS= read -r installer; do
            for wanted in "$installer" "$installer.sig"; do
              if ! grep -qxF "$wanted" <<< "$assets"; then
                echo "::error::The draft has no $wanted, so the update would not install. The draft stays unpublished."
                exit 1
              fi
            done
          done <<< "$installers"
          gh release upload "$tag" "$folder/latest.json" --clobber
          gh release edit "$tag" --draft=false --latest
          echo "Published $tag. Updates point to:"
          echo "$installers"

      - name: Mirror the update
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.UPDATES_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ github.repository_owner }}/kinuza-updates
        run: |
          set -euo pipefail
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice::Secret UPDATES_MIRROR_TOKEN is not set, the update mirror is skipped."
            exit 0
          fi
          tag="$GITHUB_REF_NAME"
          folder=$(mktemp -d)
          gh release download "$tag" --dir "$folder" --pattern latest.json
          installers=$(node scripts/check-update-manifest.cjs "$folder/latest.json" "${tag#v}")
          while IFS= read -r installer; do
            gh release download "$tag" --dir "$folder" --pattern "$installer" --pattern "$installer.sig"
          done <<< "$installers"
          node scripts/check-update-manifest.cjs "$folder/latest.json" "${tag#v}" "https://github.com/$GITHUB_REPOSITORY/releases/download/" "https://github.com/$MIRROR_REPO/releases/download/" > /dev/null
          GH_TOKEN="$MIRROR_TOKEN" gh release create "$tag" --repo "$MIRROR_REPO" --title "Kinuza ${tag#v}" --notes "Kinuza ${tag#v}" --latest "$folder"/*
