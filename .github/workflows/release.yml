name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag, the secrets, and read the release notes
        id: meta
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TMDB_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json. Release with scripts/publish.ps1, it keeps them in step."
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set: the update would be unsigned and installed apps would reject it."
            exit 1
          fi
          if [ -z "$TMDB_KEY" ]; then
            echo "::error::Secret VITE_TMDB_API_KEY is not set: the catalog would be empty in this build."
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          {
            echo "notes<<KINUZA_NOTES_END"
            echo "${notes:-Новая версия Kinuza.}"
            echo "KINUZA_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.VITE_OPENSUBTITLES_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kinuza __VERSION__"
          releaseBody: ${{ steps.meta.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Check the draft and publish it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          folder=$(mktemp -d)
          gh release download "$tag" --pattern latest.json --dir "$folder"
          installer=$(node scripts/check-update-manifest.cjs "$folder/latest.json" "${tag#v}")
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for wanted in "$installer" "$installer.sig"; do
            if ! grep -qxF "$wanted" <<< "$assets"; then
              echo "::error::The draft has no $wanted, so the update would not install. The draft stays unpublished."
              exit 1
            fi
          done
          gh release edit "$tag" --draft=false --latest
          echo "Published $tag: latest.json points to $installer"

      - name: Mirror the update
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.UPDATES_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ github.repository_owner }}/kinuza-updates
        run: |
          set -euo pipefail
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice::Secret UPDATES_MIRROR_TOKEN is not set, the update mirror is skipped."
            exit 0
          fi
          tag="$GITHUB_REF_NAME"
          folder=$(mktemp -d)
          gh release download "$tag" --dir "$folder" --pattern latest.json --pattern '*-setup.exe' --pattern '*-setup.exe.sig'
          node scripts/check-update-manifest.cjs "$folder/latest.json" "${tag#v}" "https://github.com/$GITHUB_REPOSITORY/releases/download/" "https://github.com/$MIRROR_REPO/releases/download/" > /dev/null
          GH_TOKEN="$MIRROR_TOKEN" gh release create "$tag" --repo "$MIRROR_REPO" --title "Kinuza ${tag#v}" --notes "Kinuza ${tag#v}" --latest "$folder"/*
