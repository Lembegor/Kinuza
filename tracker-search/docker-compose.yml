services:
  search:
    build: .
    container_name: kinuza-search
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Kyiv
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8091:8091"
    mem_limit: 150m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
