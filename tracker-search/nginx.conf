# conf.d/kinuza-proxy.conf
limit_req_zone $binary_remote_addr zone=kinuza_search:1m rate=4r/s;

# inside both server blocks (channeluza.com and kinuza-direct-https), next to /kinuza/rt/
location ^~ /kinuza/search/ {
    limit_req zone=kinuza_search burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    client_max_body_size 16k;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
}
