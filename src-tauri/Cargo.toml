[package]
name = "kinuza"
version = "0.1.0"
description = "Kinuza - a media library and torrent streaming player"
edition = "2021"

[lib]
name = "kinuza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
anyhow = "1"
bytes = "1"
winreg = "0.55"
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio-stream = "0.1"
percent-encoding = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
