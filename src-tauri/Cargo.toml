[package]
name = "kinuza"
version = "0.1.0"
description = "Kinuza - a media library and torrent streaming player"
edition = "2021"

[lib]
name = "kinuza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
anyhow = "1"
bytes = "1"
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", features = ["json", "multipart"] }
flate2 = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio-stream = "0.1"
rustfft = "6"
percent-encoding = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util"] }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ed25519-dalek = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
winreg = "0.55"
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "optimization", "xz"] }
tar = { version = "0.4", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-peer-protocol = { path = "vendor/librqbit-peer-protocol" }
