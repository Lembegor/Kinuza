# conf.d/kinuza-proxy.conf
limit_req_zone $kinuza_client zone=kinuza_account:2m rate=6r/s;

# inside both server blocks (channeluza.com and kinuza-direct-https), next to /kinuza/search/
location ^~ /kinuza/account/ {
    limit_req zone=kinuza_account burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8093/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    client_max_body_size 13m;
    access_log off;
    add_header X-Robots-Tag "noindex" always;
}
